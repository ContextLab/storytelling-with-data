<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One person with measles enters a room of 100 people</title>
<style>
  :root {
    --bg: #f8f4e8;
    --text: #2a2520;
    --muted: #7a6f60;
    --line: #d4cab5;
    --immune: #d8cfb8;
    --susceptible: #3a3530;
    --exposed: #c9930b;
    --infectious: #c1272d;
    --recovered: #7a3b69;
    --vulnerable: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 18px 20px 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .model-footer {
    margin: 16px 0 0;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .controls {
    margin: 40px 0 24px;
    padding-top: 24px;
    border-top: 1px dashed var(--line);
    display: flex;
    gap: 12px;
    width: 900px;
    max-width: 100%;
    justify-content: center;
  }
  .controls-hint {
    width: 900px;
    max-width: 100%;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: -16px;
    margin-bottom: 8px;
    font-style: italic;
  }
  button {
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--text);
    padding: 10px 20px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s, color 0.15s;
  }
  button:hover:not(:disabled) {
    background: var(--text);
    color: var(--bg);
  }
  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .scenario-frame {
    width: 820px;
    max-width: 100%;
    flex-shrink: 0;
  }
  .scenario-frame svg { display: block; }
  .scenario-header {
    text-align: center;
    margin-bottom: 4px;
  }
  .scenario-title, .scenario-subtitle, .grid-meta { display: none; }  /* moved into SVG */


  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--bg);
  }
  .sim-row {
    display: flex;
    align-items: center;
    gap: 32px;
    max-width: 100%;
  }
  .legend {
    display: flex;
    flex-direction: column;
    gap: 14px;
    font-size: 15px;
    color: var(--text);
    flex-shrink: 0;
    min-width: 200px;
    /* Vertically center against the grid (which is inside the SVG).
       The SVG occupies most of the scenario-frame's vertical space; using
       align-self center on the legend lets it sit at the vertical midpoint
       of the scenario-frame. */
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .swatch-immune {
    border: 1px solid var(--line);  /* so the pale immune dot is visible in legend */
  }
  .swatch-ring {
    border: 2.5px solid var(--vulnerable);
    background: transparent;
  }
</style>
</head>
<body>

<div class="sim-row">
<div class="legend">
  <div class="legend-item"><span class="swatch swatch-immune" style="background: var(--immune)"></span>Vaccinated (immune)</div>
  <div class="legend-item"><span class="swatch" style="background: var(--susceptible)"></span>Susceptible</div>
  <div class="legend-item"><span class="swatch" style="background: var(--recovered)"></span>Got sick</div>
  <div class="legend-item"><span class="swatch swatch-ring"></span>Cannot be vaccinated</div>
</div>
<div class="scenario-frame">
  <svg id="canvas" viewBox="0 0 820 540" preserveAspectRatio="xMidYMid meet"></svg>
</div>
</div>

<div class="controls">
  <button id="btn-ct">Play Connecticut</button>
  <button id="btn-id" disabled>Play Idaho</button>
  <button id="btn-reset" disabled>Reset</button>
</div>

<div class="model-footer">
  Neighbor-based SEIR &nbsp;|&nbsp; R<sub>0</sub>=15, latent 10 days, infectious 8 days, vaccine efficacy 97%
</div>

function setDotPositions(positions) {
  // positions: array of [x_px, y_px]

  rings.forEach(r => {
    const [x, y] = positions[r.dot_idx];
    r.el.setAttribute('cx', x);
    r.el.setAttribute('cy', y);
  });
}

function setDotColors(state) {
  for (let i = 0; i < 100; i++) {
    dots[i].setAttribute('fill', COLORS[state[i]]);
  }
}

function getGridPositions() {
  return GX.map((_, i) => gridToPx(GX[i], GY[i]));
}

function getSortedPositions(targets) {
  return targets.map(([gx, gy]) => gridToPx(gx, gy));
}

function interpolatePositions(from, to, t) {
  return from.map(([x1, y1], i) => [
    x1 + (to[i][0] - x1) * t,
    y1 + (to[i][1] - y1) * t,
  ]);
}

function countInfected(state) {
  return state.filter(s => s === 2 || s === 3 || s === 4).length;
}

function cubicEaseInOut(t) {
  return 3 * t * t - 2 * t * t * t;
}

  titleEl.textContent = data.label;
  subtitleEl.textContent = data.subtitle;
  hideGroupLabels();

  const history = data.history;
  const totalDays = history.length;
  const entryMs = 900;        // index case slides in from the left
  const entryPauseMs = 400;   // brief pause after arrival before sim begins
  const dayDurationMs = 220;
  const holdMs = 800;
  const sortMs = 1600;
  const endHoldMs = 1500;

  const startTime = performance.now();
  const entryEnd = entryMs;
  const pauseEnd = entryEnd + entryPauseMs;
  const simEnd = pauseEnd + totalDays * dayDurationMs;
  const holdEnd = simEnd + holdMs;
  const sortEnd = holdEnd + sortMs;
  const totalDuration = sortEnd + endHoldMs;

  const gridPositions = getGridPositions();
  const sortedPositions = getSortedPositions(data.sorted_targets);

  // Find the index case — the one dot that starts as Infectious (state 3)
  const day0 = history[0];
  let indexCase = -1;
  for (let i = 0; i < 100; i++) {
    if (day0[i] === 3) { indexCase = i; break; }
  }

  // Day 0 state with the index case temporarily hidden from the grid
  // (we render it separately during entry)
  const day0Hidden = day0.slice();
  // To "hide" without disturbing colors, we'll move that one dot off-screen during entry

  function frame(now) {
    const elapsed = now - startTime;

    if (elapsed < entryEnd) {
      // Entry phase: render day-0 baseline (no infections yet visible at their place)
      // then animate the index case dot from off-left to its grid position.
      const t = cubicEaseInOut(elapsed / entryMs);
      // Build positions: everyone in their grid spot, except the index case which slides in
      const positions = gridPositions.map(p => [p[0], p[1]]);
      if (indexCase >= 0) {
        const targetX = gridPositions[indexCase][0];
        const targetY = gridPositions[indexCase][1];
        const startX = -40; // off-screen left
        positions[indexCase] = [startX + (targetX - startX) * t, targetY];
      }
      setDotPositions(positions);
      setDotColors(day0);
      dayEl.textContent = '';
      infEl.textContent = '';
      infEl.setAttribute('fill', 'var(--text)');
      hideGroupLabels();
      hideSlotMarkers();
      animationId = requestAnimationFrame(frame);
      return;
    }

    if (elapsed < pauseEnd) {
      // Brief settling pause with index case in place
      setDotPositions(gridPositions);
      setDotColors(day0);
      dayEl.textContent = 'Day 1';
      const nInf = countInfected(day0);
      infEl.textContent = `${nInf} infected so far`;
      infEl.setAttribute('fill', 'var(--infectious)');
      hideGroupLabels();
      animationId = requestAnimationFrame(frame);
      return;
    }

    if (elapsed < simEnd) {
      const day = Math.min(Math.floor((elapsed - pauseEnd) / dayDurationMs), totalDays - 1);
      const state = history[day];
      setDotPositions(gridPositions);
      setDotColors(state);
      const nInf = countInfected(state);
      dayEl.textContent = `Day ${day + 1}`;
      if (nInf > 0) {
        infEl.textContent = `${nInf} infected so far`;
        infEl.setAttribute('fill', 'var(--infectious)');
      } else {
        infEl.textContent = '';
        infEl.setAttribute('fill', 'var(--text)');
      }
      hideGroupLabels();
      hideSlotMarkers();
      animationId = requestAnimationFrame(frame);
    } else if (elapsed < holdEnd) {
      setDotPositions(gridPositions);
      setDotColors(history[totalDays - 1]);
      dayEl.textContent = `Day ${totalDays} — outbreak over`;
      infEl.textContent = `${data.total_infected} infected total`;
      infEl.setAttribute('fill', 'var(--text)');
      hideGroupLabels();
      hideSlotMarkers();
      animationId = requestAnimationFrame(frame);
    } else if (elapsed < sortEnd) {
      const t = cubicEaseInOut((elapsed - holdEnd) / sortMs);
      const positions = interpolatePositions(gridPositions, sortedPositions, t);
      setDotPositions(positions);
      setDotColors(history[totalDays - 1]);
      dayEl.textContent = `Day ${totalDays} — outbreak over`;
      infEl.textContent = `${data.total_infected} infected total`;
      const labelAlpha = Math.max(0, (t - 0.6) / 0.4);
      updateGroupLabels(data, labelAlpha);
      updateSlotMarkers(scenarioKey, t);
      animationId = requestAnimationFrame(frame);
    } else if (elapsed < totalDuration) {
      setDotPositions(sortedPositions);
      setDotColors(history[totalDays - 1]);
      updateGroupLabels(data, 0.95);
      updateSlotMarkers(scenarioKey, 1.0);
      animationId = requestAnimationFrame(frame);
    } else {
      setDotPositions(sortedPositions);
      setDotColors(history[totalDays - 1]);
      updateGroupLabels(data, 0.95);
      isAnimating = false;
      if (onDone) onDone();
    }
  }

  animationId = requestAnimationFrame(frame);
}

function resetToInitial(scenarioKey) {
  if (animationId) cancelAnimationFrame(animationId);
  isAnimating = false;
  const data = DATA[scenarioKey];
  titleEl.textContent = data.label;
  subtitleEl.textContent = data.subtitle;
  // Place all dots in grid, but render the day-0 state with the index case
  // moved off-screen left so it can slide in when play is pressed.
  const positions = getGridPositions().map(p => [p[0], p[1]]);
  const day0 = data.history[0];
  let indexCase = -1;
  for (let i = 0; i < 100; i++) {
    if (day0[i] === 3) { indexCase = i; break; }
  }
  if (indexCase >= 0) positions[indexCase] = [-40, positions[indexCase][1]];
  setDotPositions(positions);
  setDotColors(day0);
  dayEl.textContent = 'Day —';
  infEl.textContent = '';
  infEl.setAttribute('fill', 'var(--text)');
  hideGroupLabels();
  hideSlotMarkers();
}

// Wire buttons
const btnCT = document.getElementById('btn-ct');
const btnID = document.getElementById('btn-id');
const btnReset = document.getElementById('btn-reset');

btnCT.addEventListener('click', () => {
  btnCT.disabled = true;
  btnID.disabled = true;
  btnReset.disabled = true;
  resetToInitial('connecticut');
  setTimeout(() => {
    playScenario('connecticut', () => {
      btnID.disabled = false;
      btnReset.disabled = false;
    });
  }, 50);
});

btnID.addEventListener('click', () => {
  btnCT.disabled = true;
  btnID.disabled = true;
  btnReset.disabled = true;
  resetToInitial('idaho');
  setTimeout(() => {
    playScenario('idaho', () => {
      btnReset.disabled = false;
    });
  }, 50);
});

btnReset.addEventListener('click', () => {
  btnCT.disabled = false;
  btnID.disabled = true;
  btnReset.disabled = true;
  resetToInitial('connecticut');
});

// Initialize with Connecticut day 1 visible
resetToInitial('connecticut');
</script>
